<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GSAP Scroll Panel Stack</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    #container {
      position: relative;
      height: 100vh;
    }

    .panel {
      position: absolute;
      width: 100%;
      height: 100vh;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #fff;
      background: #333;
    }

    .panel:nth-child(2) { background: #5a189a; }
    .panel:nth-child(3) { background: #f72585; }
    .panel:nth-child(4) { background: #7209b7; }
    .panel:nth-child(5) { background: #3a0ca3; }
    .panel:nth-child(6) { background: #4361ee; }
  </style>
</head>
<body>

<div id="container">
  <section class="panel">Panel 1</div>
  <div class="panel">Panel 2</div>
  <div class="panel">Panel 3</div>
  <div class="panel">Panel 4</div>
  <div class="panel">Panel 5</div>
  <div class="panel">Panel 6</div>
</div>

<!-- GSAP & ScrollTrigger -->
<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>


</body>
</html>
